    <script>
      if (typeof window !== 'undefined') {
        const origConsoleError = console.error;
        console.error = function(...args) {
          const msg = args.map(a => typeof a === 'string' ? a : (a && a.message) || '').join(' ');
          if (
            msg.includes('Could not reach Cloud Firestore backend') ||
            msg.includes('Backend didn\'t respond within 10 seconds') ||
            msg.includes('@firebase/firestore')
          ) {
            console.warn('[Firestore Offline Notice]', ...args);
            return;
          }
          origConsoleError.apply(console, args);
        };

        window.addEventListener('unhandledrejection', function(event) {
          const reasonStr = (event.reason && (event.reason.message || event.reason.stack || String(event.reason))) || '';
          if (
            reasonStr.includes('WebSocket') || 
            reasonStr.includes('vite') ||
            reasonStr.includes('Could not reach Cloud Firestore backend') ||
            reasonStr.includes('Backend didn\'t respond within 10 seconds')
          ) {
            event.preventDefault();
            event.stopPropagation();
          }
        });
      }
      if (typeof window !== 'undefined' && typeof window.fetch !== 'undefined') {
        try {
          const origFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() { return origFetch; },
            set: function(v) { console.warn("Prevented overwriting window.fetch"); }
          });
        } catch(e) {}
      }
    </script>
